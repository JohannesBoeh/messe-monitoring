# Save as: .github/workflows/auma_scraper.yml
# Script must be at: scripts/auma_scraper.py

name: AUMA Messe Monitoring

on:
  schedule:
    - cron: "0 6 * * 1"   # Every Monday 06:00 UTC

  workflow_dispatch:
    inputs:
      year_from:
        description: "Start year"
        required: false
        default: "2026"
      year_to:
        description: "End year"
        required: false
        default: "2032"
      include_non_fkm:
        description: "Include non-FKM fairs? (true/false)"
        required: false
        default: "false"
      no_browser:
        description: "Skip Playwright (API-only mode)? (true/false)"
        required: false
        default: "false"

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 playwright

      - name: Debug API fields
        run: python scripts/debug_api.py

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run AUMA scraper
        run: |
          YEAR_FROM="${{ github.event.inputs.year_from || '2026' }}"
          YEAR_TO="${{ github.event.inputs.year_to || '2032' }}"
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.include_non_fkm }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --include-non-fkm"
          fi
          if [ "${{ github.event.inputs.no_browser }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --no-browser"
          fi
          python scripts/auma_scraper.py \
            --year-from "$YEAR_FROM" \
            --year-to   "$YEAR_TO"   \
            --output AUMA_FKM_Messen.csv \
            --delay 1.5 \
            $EXTRA_FLAGS

      - name: Upload CSV as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUMA-FKM-Messen-${{ github.run_id }}
          path: AUMA_FKM_Messen.csv
          retention-days: 90

      - name: Commit updated CSV to repo
        if: github.event_name == 'schedule'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AUMA_FKM_Messen.csv
          git diff --cached --quiet || git commit -m "chore: update AUMA data $(date -u +%Y-%m-%d)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

